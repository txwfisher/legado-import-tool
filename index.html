<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>快捷导入</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --sub: #7f8c8d;
            --border: #d0d7de;
            --accent: #5b7fff;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 16px 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: visible;
        }

        .avatar {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: #eef1f5;
            flex-shrink: 0;
        }

        .title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
            line-height: 1;
            margin-top: 4px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            padding: 10px 0 8px;
            font-size: 0.9rem;
            font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive;
            color: var(--text);
            background: transparent;
            border: none;
            border-bottom: 2px solid #d0d7de;
            border-radius: 0;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            line-height: 1.5;
        }
        textarea:focus {
            border-bottom-color: var(--accent);
            box-shadow: 0 1px 0 0 var(--accent);
        }
        textarea::placeholder {
            color: #b0b8c1;
            font-family: inherit;
            font-size: 0.85rem;
        }

        /* ===== 按钮区（关键修复）===== */
        .btn-row {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            padding: 0 8px;
        }
        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            background: transparent;
            flex-shrink: 0;
            outline: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0.08);
            transition: background var(--transition), transform 0.12s ease, box-shadow var(--transition);
            /* 关键：确保按钮可点击 */
            position: relative;
            z-index: 2;
            pointer-events: auto;
        }
        .btn-icon svg {
            width: 1.2rem;
            height: 1.2rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* 关键：SVG 不拦截点击 */
            pointer-events: none;
        }
        .btn-icon:active {
            transform: scale(0.93);
        }
        .btn-icon:hover {
            color: #000;
            background: rgba(0,0,0,0.06);
        }

        /* 导入按钮 —— 主操突出 */
        .btn-icon.btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-icon.btn-primary svg {
            stroke: #fff;
        }
        .btn-icon.btn-primary:hover {
            background: #4a6ef5;
            box-shadow: 0 2px 10px rgba(91,127,255,0.35);
        }
        .btn-icon.btn-primary:active {
            background: #3f5fe0;
        }

        .divider {
            width: 100%;
            border: none;
            border-top: 1px solid #e0e4e8;
            margin: 4px 0 2px;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-align: center;
            letter-spacing: 0.03em;
            line-height: 1.4;
            user-select: none;
            padding-bottom: 4px;
        }
        .footer-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }

        /* 右上角提示 */
        .card-toast {
            position: absolute;
            top: 12px;
            right: 12px;
            color: #2c3e50;
            background: transparent;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
            line-height: 1.4;
            max-width: 60%;
            text-align: right;
            word-break: break-word;
        }
        .card-toast.show {
            opacity: 1;
        }

        /* 移动端微调 */
        @media (max-width: 400px) {
            .card {
                padding: 18px 12px 14px;
                gap: 14px;
            }
            .btn-icon {
                width: 40px;
                height: 40px;
            }
            .btn-icon svg {
                width: 1.1rem;
                height: 1.1rem;
            }
            .btn-row {
                gap: 8px;
                padding: 0 4px;
            }
            .title {
                font-size: 1.2rem;
            }
            .avatar {
                border-radius: 10px;
            }
            .card-toast {
                top: 8px;
                right: 8px;
                font-size: 0.8rem;
                max-width: 70%;
            }
            .footer-text {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 右上角提示容器 -->
        <div id="cardToast" class="card-toast"></div>

        <img
            class="avatar"
            src="https://img.tucong.vip/file/1779591236379_a46372ff45bc5524.jpg"
            alt="头像"
            loading="lazy"
        >

        <span class="title">导入</span>

        <div class="input-group">
            <textarea id="copyt" rows="3" placeholder="粘贴含杂质、中文、Base64的链接..."></textarea>
            <textarea id="processedText" rows="2" placeholder="净化后的链接..."></textarea>
        </div>

        <div class="btn-row">
            <!-- 清空 -->
            <button class="btn-icon" id="btn2" onclick="cleart()" title="清空">
                <svg viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/><path d="M14 11v6"/>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
            </button>
            <!-- 净化 -->
            <button class="btn-icon" id="btn3" onclick="purify()" title="净化">
                <svg viewBox="0 0 24 24">
                    <path d="M15 4V2"/><path d="M15 16v-2"/>
                    <path d="M8 9h2"/><path d="M20 9h2"/>
                    <path d="M17.8 11.8 19 13"/><path d="M15 9h0"/>
                    <path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/>
                    <path d="M12.2 6.2 11 5"/>
                </svg>
            </button>
            <!-- 复制 -->
            <button class="btn-icon" id="btnCopy" onclick="copyProcessed()" title="复制">
                <svg viewBox="0 0 24 24">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </button>
            <!-- 导入（主操） -->
            <button class="btn-icon btn-primary" id="btn1" onclick="importContent()" title="导入">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.5 16.5c-1.5 1.5-2 4-2 4s2.5-.5 4-2c.5-.5.8-1.2.8-2"/>
                    <path d="M9 10l6-6s3 3 6 0-3 6-3 6L9 22l-3-3 3-9z"/>
                    <path d="M14 5l5 5"/>
                </svg>
            </button>
        </div>

        <hr class="divider">

        <!-- 已按要求修改 -->
        <div class="footer-text">
            由 <a href="https://tucong.vip/" target="_blank">Tuco's Home</a> 强力驱动
        </div>
    </div>

    <script>
        (function() {
            const toast = document.getElementById('cardToast');

            function showToast(msg, duration = 2000) {
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // 核心净化逻辑
            function purifyUrl(input) {
                let url = input.trim();
                if (!url) return '未找到有效链接';

                try {
                    if (url.startsWith('data:')) {
                        url = atob(url.split(',')[1] || '');
                    } else if (/^[\da-z\+/]{20,}=*$/i.test(url)) {
                        url = atob(url);
                    }
                } catch (e) {}

                url = url.replace(/[\u4e00-\u9fa5]/g, '');
                url = url.replace(/[网盘链接提取码复制\s\n\r\t]/g, '');

                let match = url.match(/(https?:\/\/|www\.)[^\s'"]+/gi);
                if (match && match.length > 0) {
                    url = match.join('');
                }

                match = url.match(/(https?:\/\/[^\s'"]+)/i);
                if (match) {
                    return match[1];
                } else if (url.includes('.json') || url.includes('.txt') || url.includes('.zip')) {
                    return 'https://' + url;
                }

                return '未找到有效链接';
            }

            window.importContent = function() {
                const processedText = document.getElementById("processedText");
                const originalText = document.getElementById("copyt");
                let url = processedText.value.trim();

                if (!url || url.includes('净化后的链接') || url.includes('未找到')) {
                    const originalUrl = originalText.value.trim();
                    if (!originalUrl) {
                        showToast('请输入内容');
                        return;
                    }
                    url = purifyUrl(originalUrl);
                    processedText.value = url;
                    if (url.includes('未找到')) {
                        showToast('无法提取有效链接');
                        return;
                    }
                }

                const encodedUrl = encodeURIComponent(url);
                try {
                    let scheme = 'legado://import/Source?src=' + encodedUrl;
                    if (/\.zip$/i.test(url)) {
                        scheme = 'legado://import/bookSource?src=' + encodedUrl;
                    } else if (!/\.(json|txt)$/i.test(url)) {
                        scheme = 'legado://import/addToBookshelf?src=' + encodedUrl;
                    }
                    window.location.href = scheme;
                    showToast('正在唤醒阅读App...');
                } catch (error) {
                    showToast('导入失败: ' + error.message);
                }
            };

            window.purify = function() {
                const cpt = document.getElementById("copyt");
                const processedText = document.getElementById("processedText");
                let url = cpt.value;
                if (!url.trim()) {
                    showToast('请输入内容');
                    return;
                }
                url = purifyUrl(url);
                processedText.value = url;
                showToast(url.includes('未找到') ? '未找到有效链接' : '净化完成');
            };

            window.cleart = function() {
                document.getElementById("copyt").value = '';
                document.getElementById("processedText").value = '';
                showToast('已清空');
            };

            window.copyProcessed = function() {
                const processedText = document.getElementById("processedText");
                const text = processedText.value;
                if (!text.trim() || text.includes('净化后的链接') || text.includes('未找到')) {
                    showToast('没有可复制的内容');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('已复制');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            };

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制');
                } catch (err) {
                    showToast('复制失败');
                }
                document.body.removeChild(ta);
            }
        })();
    </script>
</body>
</html>
