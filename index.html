<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能净化并导入</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --sub: #7f8c8d;
            --border: #d0d7de;
            --accent: #5b7fff;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 16px 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: box-shadow 0.3s ease;
            position: relative;
            overflow: visible;
        }
        .card:hover {
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.10);
        }

        .avatar {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            background: #eef1f5;
            flex-shrink: 0;
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .avatar:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
            line-height: 1;
            margin-top: 4px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            padding: 10px 0 8px;
            font-size: 0.9rem;
            font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive;
            color: var(--text);
            background: transparent;
            border: none;
            border-bottom: 2px solid #d0d7de;
            border-radius: 0;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            line-height: 1.5;
        }
        textarea:focus {
            border-bottom-color: var(--accent);
            box-shadow: 0 1px 0 0 var(--accent);
        }
        textarea::placeholder {
            color: #b0b8c1;
            font-family: inherit;
            font-size: 0.85rem;
        }

        .btn-row {
            display: flex;
            gap: 52px;
            width: 100%;
            justify-content: center;
            margin-top: 4px;
            padding: 0 8px;
        }
        .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            background: transparent;
            flex-shrink: 0;
            outline: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.08);
        }
        .btn-icon i {
            font-size: 1.2rem;
            line-height: 1;
        }
        .btn-icon:active {
            transform: scale(0.93);
        }
        .btn-icon:hover {
            color: #000;
        }

        .divider {
            width: 100%;
            border: none;
            border-top: 1px solid #e0e4e8;
            margin: 4px 0 2px;
        }

        .yanwen {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-align: center;
            letter-spacing: 0.03em;
            line-height: 1.4;
            user-select: none;
            padding-bottom: 4px;
        }
        .yanwen a {
            color: var(--accent);
            text-decoration: none;
        }
        .yanwen a:hover {
            text-decoration: underline;
        }

        /* 右上角提示 */
        .card-toast {
            position: absolute;
            top: 12px;
            right: 12px;
            color: #2c3e50;
            background: transparent;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
            line-height: 1.4;
            max-width: 60%;
            text-align: right;
            white-space: normal;
            word-break: break-word;
        }
        .card-toast.show {
            opacity: 1;
        }

        /* 移动端微调 */
        @media (max-width: 400px) {
            .card {
                padding: 18px 12px 14px;
                gap: 14px;
            }
            .btn-icon {
                width: 40px;
                height: 40px;
            }
            .btn-icon i {
                font-size: 1.15rem;
            }
            .btn-row {
                gap: 18px;
            }
            .title {
                font-size: 1.2rem;
            }
            .avatar {
                border-radius: 10px;
            }
            .card-toast {
                top: 8px;
                right: 8px;
                font-size: 0.8rem;
                max-width: 70%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 右上角提示容器 -->
        <div id="cardToast" class="card-toast"></div>

        <img
            class="avatar"
            src="https://img.tucong.vip/file/1779591236379_a46372ff45bc5524.jpg"
            alt="头像"
            loading="lazy"
        >

        <span class="title">智能净化并导入</span>

        <div class="input-group">
            <textarea id="copyt" rows="3" placeholder="粘贴含杂质、中文、Base64的链接..."></textarea>
            <textarea id="processedText" rows="2" placeholder="净化后的链接..."></textarea>
        </div>

        <div class="btn-row">
            <button class="btn-icon" id="btn2" onclick="cleart()" title="清空">
                🗑️
            </button>
            <button class="btn-icon" id="btn3" onclick="purify()" title="净化">
                ✨
            </button>
            <button class="btn-icon" id="btnCopy" onclick="copyProcessed()" title="复制">
                📋
            </button>
            <button class="btn-icon" id="btn1" onclick="importContent()" title="导入">
                🚀
            </button>
        </div>

        <hr class="divider">

        <div class="yanwen">
            由 <a href="https://www.tucong.vip" target="_blank">TuCong</a> 强力驱动
        </div>
    </div>

    <script>
        (function() {
            const toast = document.getElementById('cardToast');

            function showToast(msg, duration = 2000) {
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // 核心净化逻辑（优化版：处理中文干扰、断行拼接）
            function purifyUrl(input) {
                let url = input.trim();
                if (!url) return '未找到有效链接';

                // 1. 解码处理（Base64/Data URI）
                try {
                    if (url.startsWith('data:')) {
                        url = atob(url.split(',')[1] || '');
                    } else if (/^[\da-z\+/]{20,}=*$/i.test(url)) {
                        url = atob(url);
                    }
                } catch (e) {}

                // 2. 强力去噪（针对“哦哦yuan.nyasa你好好4207a465d0.json”）
                url = url.replace(/[\u4e00-\u9fa5]/g, ''); // 移除所有中文
                url = url.replace(/[网盘链接提取码复制\s\n\r\t]/g, ''); // 移除干扰词和空白

                // 3. 提取有效链接（支持断行拼接）
                let match = url.match(/(https?:\/\/|www\.)[^\s'"]+/gi);
                if (match && match.length > 0) {
                    url = match.join(''); // 拼接断行片段
                }

                // 4. 最终校验与补全
                match = url.match(/(https?:\/\/[^\s'"]+)/i);
                if (match) {
                    return match[1];
                } else if (url.includes('.json') || url.includes('.txt') || url.includes('.zip')) {
                    return 'https://' + url; // 补全协议
                }

                return '未找到有效链接';
            }

            window.importContent = function() {
                const processedText = document.getElementById("processedText");
                const originalText = document.getElementById("copyt");
                let url = processedText.value.trim();

                // 若输出为空/默认文本，先自动净化
                if (!url || url.includes('净化后的链接') || url.includes('未找到')) {
                    const originalUrl = originalText.value.trim();
                    if (!originalUrl) {
                        showToast('请输入内容');
                        return;
                    }
                    url = purifyUrl(originalUrl);
                    processedText.value = url;
                    if (url.includes('未找到')) {
                        showToast('无法提取有效链接');
                        return;
                    }
                }

                const encodedUrl = encodeURIComponent(url);

                try {
                    // 智能识别导入类型
                    let scheme = 'legado://import/Source?src=' + encodedUrl;
                    if (/\.zip$/i.test(url)) {
                        scheme = 'legado://import/bookSource?src=' + encodedUrl;
                    } else if (!/\.(json|txt)$/i.test(url)) {
                        scheme = 'legado://import/addToBookshelf?src=' + encodedUrl;
                    }
                    window.location.href = scheme;
                    showToast('正在唤醒阅读App...');
                } catch (error) {
                    showToast('导入失败: ' + error.message);
                }
            };

            window.purify = function() {
                const cpt = document.getElementById("copyt");
                const processedText = document.getElementById("processedText");
                let url = cpt.value;
                if (!url.trim()) {
                    showToast('请输入内容');
                    return;
                }
                url = purifyUrl(url);
                processedText.value = url;
                showToast(url.includes('未找到') ? '未找到有效链接' : '净化完成');
            };

            window.cleart = function() {
                document.getElementById("copyt").value = '';
                document.getElementById("processedText").value = '';
                showToast('已清空');
            };

            window.copyProcessed = function() {
                const processedText = document.getElementById("processedText");
                const text = processedText.value;
                if (!text.trim() || text.includes('净化后的链接') || text.includes('未找到')) {
                    showToast('没有可复制的内容');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('已复制');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            };

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制');
                } catch (err) {
                    showToast('复制失败');
                }
                document.body.removeChild(ta);
            }
        })();
    </script>
</body>
</html>
